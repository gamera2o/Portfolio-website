<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Temperature and Humidity</title>
    <script>
        function fetchData() {
            fetch('https://tem.abhishekthapa123456789.workers.dev/')  // Replace with your worker URL
                .then(response => response.json())  // Parse the response as JSON
                .then(data => {
                    if (data.temperature && data.humidity) {
                        document.getElementById("data").innerHTML = `Temperature: ${data.temperature}°C <br> Humidity: ${data.humidity}%`;
                    } else {
                        document.getElementById("data").innerHTML = "Error: No data received";
                    }
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    document.getElementById("data").innerHTML = 'Failed to load data';
                });
        }

        setInterval(fetchData, 10000);  // Fetch every 10 seconds
    </script>
</head>
<body>
    <h1>Temperature and Humidity Data</h1>
    <div id="data">Waiting for data...</div>
</body>
</html>
