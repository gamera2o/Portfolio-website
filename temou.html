<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Temperature and Humidity</title>
    <script>
        function fetchData() {
            fetch('https://temp.abhishekthapa123456789.workers.dev/')  // Replace with your worker or PHP URL
                .then(response => response.json())  // Parse the response as JSON
                .then(data => {
                    // Display temperature and humidity
                    const temperature = data.temperature;
                    const humidity = data.humidity;
                    document.getElementById("data").innerHTML = `Temperature: ${temperature}°C <br> Humidity: ${humidity}%`;
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    document.getElementById("data").innerHTML = 'Failed to load data';
                });
        }

        setInterval(fetchData, 10000);  // Fetch every 10 seconds
    </script>
</head>
<body>
    <h1>Temperature and Humidity Data</h1>
    <div id="data">Waiting for data...</div>
</body>
</html>
