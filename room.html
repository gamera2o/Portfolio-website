<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Smart Room Dashboard</title>

<!-- Firebase (compat) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<!-- Chart.js + JustGage + Raphael -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/raphael@2.3.0/raphael.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/justgage@1.3.2/justgage.min.js"></script>

<style>
/* filepath: c:\Users\abhis\OneDrive - MSFT\Desktop\room.html - styling (updated) */
:root{
  --bg:#0f1724;
  --panel:#0b1220;
  --accent:#6a82fb;
  --muted:#94a3b8;
  --card:#0b1320;
  --glass: rgba(255,255,255,0.03);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter, "Segoe UI", Roboto, Arial, sans-serif;
  background:linear-gradient(180deg,#071126 0%, #0b1220 60%);
  color:#e6eef8;
  -webkit-font-smoothing:antialiased;
  padding:18px;
}
.header{
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  max-width:1200px;
  margin:0 auto 20px;
}
.brand { display:flex; gap:12px; align-items:center; }
.logo {
  width:56px; height:56px; border-radius:10px;
  background:linear-gradient(135deg,var(--accent),#fc5c7d);
  display:flex; align-items:center; justify-content:center; font-weight:700;
  box-shadow:0 6px 18px rgba(0,0,0,0.5);
}
.title { font-size:1.25rem; margin:0; }
.subtitle { color:var(--muted); font-size:0.85rem; margin:0; }

.controls { display:flex; gap:10px; align-items:center; }

.grid {
  max-width:1200px;
  margin:0 auto;
  display:grid;
  grid-template-columns: repeat(12,1fr);
  gap:14px;
}

/* cards */
.card{
  background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  border-radius:12px;
  padding:14px;
  box-shadow: 0 6px 20px rgba(2,6,23,0.6);
  color:inherit;
  border:1px solid rgba(255,255,255,0.03);
}

/* layout */
.card-large { grid-column: span 8; min-height:220px; }
.card-small { grid-column: span 4; min-height:220px; display:flex; flex-direction:column; gap:10px; align-items:center; justify-content:center; }

.metrics { display:flex; gap:12px; align-items:center; justify-content:center; width:100%; flex-wrap:wrap; }
.metric { width:160px; height:140px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }

.status { display:flex; gap:10px; align-items:center; color:var(--muted); font-size:0.95rem; }
.badge { padding:6px 10px; border-radius:999px; background:var(--glass); color:var(--muted); font-weight:600; font-size:0.9rem; }

.chart-wrap { width:100%; height:340px; padding:8px; }

/* footer controls */
.footer { display:flex; gap:8px; align-items:center; justify-content:flex-end; margin-top:8px; }
.btn {
  background:linear-gradient(90deg,var(--accent),#fc5c7d);
  border:none; color:white; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:600;
}
.btn.secondary { background:#263342; color:#cfe3ff; border:1px solid rgba(255,255,255,0.04); }
.small-muted { color:var(--muted); font-size:0.85rem; }

/* responsive */
@media (max-width:900px){
  .card-large { grid-column: span 12; }
  .card-small { grid-column: span 12; flex-direction:row; padding:10px; }
  .metric { width:120px; height:110px; }
}
</style>
</head>
<body>
<div class="header">
  <div class="brand">
    <div class="logo">SR</div>
    <div>
      <h1 class="title">Smart Room Dashboard</h1>
      <div class="subtitle">Realtime sensor data · Temperature · Humidity · Gas</div>
    </div>
  </div>

  <div class="controls">
    <div class="status">
      <div id="connBadge" class="badge">Connecting...</div>
      <div class="small-muted">Last update: <span id="lastUpdate">--</span></div>
    </div>
  </div>
</div>

<div class="grid">
  <div class="card card-large">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div>
        <h3 style="margin:0">Temperature History</h3>
        <div class="small-muted">Live and historical values from Firebase</div>
      </div>
      <div>
        <button id="exportBtn" class="btn secondary">Export CSV</button>
        <button id="clearBtn" class="btn secondary">Clear View</button>
      </div>
    </div>

    <div class="chart-wrap">
      <canvas id="historyChart"></canvas>
    </div>
  </div>

  <div class="card card-small">
    <h3 style="margin:0 0 6px 0">Current Readings</h3>
    <div class="metrics">
      <div class="metric card" id="gtemp"><div id="gTempDiv" style="width:120px;height:80px"></div><div class="small-muted">Temperature</div><div id="gTempVal" style="font-weight:700;margin-top:4px">-- °C</div></div>
      <div class="metric card" id="ghum"><div id="gHumDiv" style="width:120px;height:80px"></div><div class="small-muted">Humidity</div><div id="gHumVal" style="font-weight:700;margin-top:4px">-- %</div></div>
      <div class="metric card" id="ggas"><div id="gGasDiv" style="width:120px;height:80px"></div><div class="small-muted">Gas</div><div id="gGasVal" style="font-weight:700;margin-top:4px">--</div></div>
    </div>
    <div style="margin-top:8px;text-align:center;">
      <div id="timeText" style="font-weight:700">--:--:--</div>
      <div class="small-muted" id="dateText">--</div>
    </div>
  </div>

  <div class="card" style="grid-column: span 12; text-align:left;">
    <h3 style="margin:0 0 8px 0">Realtime /Room Value (debug)</h3>
    <pre id="rawDebug" style="background:rgba(255,255,255,0.02); padding:10px; border-radius:8px; max-height:120px; overflow:auto;">--</pre>
  </div>
</div>

<script>
// Firebase config - use your project's databaseURL
const firebaseConfig = {
  databaseURL: "https://project-class-e66e5-default-rtdb.asia-southeast1.firebasedatabase.app"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// small helpers
function fmt(v, decimals=1){ return (v===null || v===undefined || isNaN(v)) ? '--' : Number(v).toFixed(decimals); }
function nowIso(){ return new Date().toLocaleString(); }

// connection badge
const connBadge = document.getElementById('connBadge');
function setConn(ok){
  connBadge.innerText = ok ? 'Connected' : 'Disconnected';
  connBadge.style.background = ok ? 'linear-gradient(90deg,#20c997,#6aefa9)' : 'linear-gradient(90deg,#ff6b6b,#ff8a8a)';
}

// Gauges (JustGage)
const gTemp = new JustGage({ id: "gTempDiv", value: 0, min: 0, max: 50, title: "", label: "°C", gaugeWidthScale:0.6 });
const gHum  = new JustGage({ id: "gHumDiv",  value: 0, min: 0, max: 100, title: "", label: "%", gaugeWidthScale:0.6 });
const gGas  = new JustGage({ id: "gGasDiv",  value: 0, min: 0, max: 1023, title: "", label: "", gaugeWidthScale:0.6 });

// Chart.js history chart
const ctx = document.getElementById('historyChart').getContext('2d');
const historyChart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: [],
    datasets: [
      { label: 'Temperature (°C)', data: [], borderColor:'#ff6b6b', backgroundColor:'rgba(255,107,107,0.08)', tension:0.2, yAxisID: 'y' },
      { label: 'Humidity (%)', data: [], borderColor:'#60a5fa', backgroundColor:'rgba(96,165,250,0.06)', tension:0.2, yAxisID: 'y2' },
      { label: 'Gas', data: [], borderColor:'#34d399', backgroundColor:'rgba(52,211,153,0.06)', tension:0.2, yAxisID: 'y3' }
    ]
  },
  options: {
    animation: false,
    maintainAspectRatio: false,
    scales: {
      x: { display:true, title:{display:false} },
      y: { type:'linear', position:'left', display:true, title:{display:true,text:'Temp'} },
      y2: { type:'linear', position:'right', display:true, grid:{drawOnChartArea:false}, title:{display:true,text:'Humidity'}, beginAtZero:true },
      y3: { type:'linear', position:'right', display:false, grid:{drawOnChartArea:false} } // gas shares right axis but hidden
    },
    plugins: { legend: { position:'top', labels:{boxWidth:12} } }
  }
});

// load recent history and populate chart
function loadHistory(){
  const histRef = db.ref('/Room/history').limitToLast(200);
  histRef.on('value', snap => {
    const v = snap.val();
    if(!v){ return; }
    const list = [];
    for(const k in v) if(Object.prototype.hasOwnProperty.call(v,k)) list.push(v[k]);
    list.sort((a,b)=> (a.ts||0) - (b.ts||0));
    historyChart.data.labels = list.map(it => it.Time || new Date((it.ts||Date.now())*1000).toLocaleTimeString());
    historyChart.data.datasets[0].data = list.map(it => it.Temperature!==undefined ? Number(it.Temperature) : null);
    historyChart.data.datasets[1].data = list.map(it => it.Humidity!==undefined ? Number(it.Humidity) : null);
    historyChart.data.datasets[2].data = list.map(it => it.Gas!==undefined ? Number(it.Gas) : null);
    historyChart.update();
  }, err => {
    console.error('history listen', err);
  });
}

// live /Room listener (single object)
function updateDashboard(snapshot){
  const data = snapshot.val();
  if(!data) return;
  // set connection status
  setConn(true);
  const t = Number(data.Temperature);
  const h = Number(data.Humidity);
  const g = Number(data.Gas);

  // update gauges and text
  gTemp.refresh(isNaN(t) ? 0 : t);
  gHum.refresh(isNaN(h) ? 0 : h);
  gGas.refresh(isNaN(g) ? 0 : g);

  document.getElementById('gTempVal').innerText = (isNaN(t) ? '--' : t.toFixed(1)) + ' °C';
  document.getElementById('gHumVal').innerText  = (isNaN(h) ? '--' : h.toFixed(0)) + ' %';
  document.getElementById('gGasVal').innerText  = isNaN(g) ? '--' : g;

  document.getElementById('timeText').innerText = data.Time || '--';
  document.getElementById('dateText').innerText = data.Date_NP || '--';

  // debug raw
  document.getElementById('rawDebug').innerText = JSON.stringify(data, null, 2);

  // append to chart (keep small buffer)
  const label = data.Time || new Date().toLocaleTimeString();
  historyChart.data.labels.push(label);
  historyChart.data.datasets[0].data.push(isNaN(t) ? null : t);
  historyChart.data.datasets[1].data.push(isNaN(h) ? null : h);
  historyChart.data.datasets[2].data.push(isNaN(g) ? null : g);
  if(historyChart.data.labels.length > 60){
    historyChart.data.labels.shift();
    historyChart.data.datasets.forEach(ds => ds.data.shift());
  }
  historyChart.update();

  // last update
  document.getElementById('lastUpdate').innerText = nowIso();
}

// attach listeners
const roomRef = db.ref('/Room');
roomRef.on('value', updateDashboard, err => {
  console.error('/Room listener failed', err);
  setConn(false);
});

// load history
loadHistory();

// controls
document.getElementById('clearBtn').addEventListener('click', ()=>{
  historyChart.data.labels = [];
  historyChart.data.datasets.forEach(ds=> ds.data = []);
  historyChart.update();
});
document.getElementById('exportBtn').addEventListener('click', ()=>{
  // build CSV from current chart data
  const labels = historyChart.data.labels;
  const rows = [ ['Time','Temperature','Humidity','Gas'] ];
  for(let i=0;i<labels.length;i++){
    rows.push([
      labels[i] || '',
      historyChart.data.datasets[0].data[i] ?? '',
      historyChart.data.datasets[1].data[i] ?? '',
      historyChart.data.datasets[2].data[i] ?? ''
    ]);
  }
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'room-history.csv'; a.click();
  URL.revokeObjectURL(url);
});

// handle connection state changes (optional)
firebase.database().ref(".info/connected").on("value", function(snap) {
  if (snap.val() === true) setConn(true); else setConn(false);
});
</script>
</body>
</html>
